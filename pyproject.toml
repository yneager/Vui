[project]
name = "autoqa-uae"
version = "1.0.0"
description = "Autonomous bilingual Arabic/English web QA scanner"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.48.0",
  "playwright==1.57.0",
  "pydantic==2.13.4",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[project.scripts]
autoqa = "autoqa.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
