name: Apply AutoQA v1.1 exact tree

on:
  push:
    branches:
      - autoqa-uae-v11-staging

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autoqa-uae-v11-staging
          fetch-depth: 0

      - name: Reconstruct exact tested source tree
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/apply-v11.yml /tmp/apply-v11.yml
          cat .upgrade.part0 .upgrade.part1 .upgrade.part2 .upgrade.part3 .upgrade.part4 .upgrade.part5 > /tmp/upgrade.b64
          base64 -d /tmp/upgrade.b64 > /tmp/upgrade.tar.gz
          echo "f03021d9b3869172a4ab926c347bad782bdf249758c1d4872aaef7c876ed24fd  /tmp/upgrade.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/upgrade.tar.gz -C .
          # GitHub's Actions token cannot create/update workflow files. Keep this
          # staging workflow unchanged for the source push; ChatGPT will swap it
          # for the tested ci.yml through the GitHub connector afterward.
          rm -f .github/workflows/ci.yml
          mkdir -p .github/workflows
          cp /tmp/apply-v11.yml .github/workflows/apply-v11.yml
          test -f autoqa/scanner.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -1)"
          test -n "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Validate upgraded product
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q autoqa tests scripts
          node --check autoqa/static/app.js
          python -m pytest -q
          python scripts/browser_probe.py
          python scripts/smoke.py

      - name: Commit validated non-workflow v1.1 source to staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stage validated AutoQA UAE v1.1 source"
          git push origin HEAD:autoqa-uae-v11-staging
